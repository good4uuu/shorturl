services:
  - type: web
    name: shorturl-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "1"
      - key: ConnectionStrings__UrlShortener
        sync: false
      - key: PublicBaseUrl
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false